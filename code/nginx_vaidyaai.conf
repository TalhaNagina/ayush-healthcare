server {
    listen 80;
    server_name _;

    # ── VAIDYAAI FRONTEND ─────────────────────────────────────────────────────
    location / {
        root /var/www/vaidyaai;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── VAIDYAAI API ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 50M;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8001/health;
    }

    # ── MSME / ASR APP (teammates) ────────────────────────────────────────────
    # Their code and URLs are unchanged — /asr, /categorise-product, /llm/generate
    # Nginx just forwards these to port 8002 where their app.py runs
    location /asr {
        proxy_pass http://127.0.0.1:8002/asr;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 50M;
        proxy_read_timeout 120s;
    }

    location /categorise-product {
        proxy_pass http://127.0.0.1:8002/categorise-product;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location /llm {
        proxy_pass http://127.0.0.1:8002/llm;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
